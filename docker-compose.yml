services:
  api:
    build:
      context: ./backend
    image: handoff-aligner-api
    environment:
      PYTHONUNBUFFERED: "1"
    ports:
      # Host port overridable via API_PORT (default 8000 -> 8000).
      - "${API_PORT:-8000}:8000"

  web:
    build:
      context: ./frontend
    image: handoff-aligner-web
    depends_on:
      api:
        condition: service_healthy
    ports:
      # Host port overridable via WEB_PORT (default 8080 on the host -> 80).
      - "${WEB_PORT:-8080}:80"

  # One-off acceptance service: real cross-container integration check
  # (health, a golden alignment, cost rules, single-error contract, anchor
  # paths, arbitrary-precision 4300/4301/10000-digit timestamps over real
  # HTTP, and a real-Chromium BigInt input/submit/result round trip).
  # Run with:  docker compose run --rm verify
  verify:
    build:
      context: ./verify
    image: handoff-aligner-verify
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    volumes:
      - ./verify:/verify:ro
    environment:
      API_URL: http://api:8000
      WEB_URL: http://web:80
    entrypoint: ["python3", "/verify/verify.py"]
